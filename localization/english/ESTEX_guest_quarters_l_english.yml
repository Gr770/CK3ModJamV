l_english:
 estex_guest_room_01_domicile_building: "Guest Quarters"
 estex_guest_room_01_domicile_building_desc: "Clean beds, a warm hearth and a stabled horse for travelers of quality. Word gets around."
 estex_guest_room_02_domicile_building: "Fine Guest Chambers"
 estex_guest_room_02_domicile_building_desc: "Proper chambers with proper linens. Guests linger longer, and lingering guests talk more freely."
 estex_guest_room_03_domicile_building: "Envoy's Lodgings"
 estex_guest_room_03_domicile_building_desc: "Rooms fit for envoys, wards and wellborn hostages. Comfortable guests are profitable guests."
 estex_guest_room_04_domicile_building: "Honored Guest Wing"
 estex_guest_room_04_domicile_building_desc: "A whole wing for those staying at your pleasure, willingly or otherwise. Their families pay handsomely for the courtesy."
 estex_guest_room_05_domicile_building: "Noble Apartments"
 estex_guest_room_05_domicile_building_desc: "Apartments that would not shame a royal palace. Visiting dignitaries leave impressed, and say so at home."
 estex_guest_room_06_domicile_building: "Palatial Guest Wing"
 estex_guest_room_06_domicile_building_desc: "Kings sleep here without complaint. The estate's hospitality is spoken of in courts you have never visited."
