l_english:
 estex_guest_room_01_domicile_building: "Guest Quarters"
 estex_guest_room_01_domicile_building_desc: "Clean beds, a warm hearth and a stabled horse for travelers of quality. Word gets around."
 estex_guest_room_02_domicile_building: "Fine Guest Chambers"
 estex_guest_room_02_domicile_building_desc: "Proper chambers with proper linens. Guests linger longer, and lingering guests talk more freely."
 estex_guest_room_03_domicile_building: "Guesten Hall"
 estex_guest_room_03_domicile_building_desc: "A dedicated hall for receiving and entertaining guests, as the great priories keep. Envoys, wards and wellborn hostages all sleep easier, and comfortable guests are profitable guests."
 estex_guest_room_04_domicile_building: "Hospitium"
 estex_guest_room_04_domicile_building_desc: "A guesthouse worthy of the old Latin word, for those staying at your pleasure, willingly or otherwise. Their families pay handsomely for the courtesy."
 estex_guest_room_05_domicile_building: "State Apartments"
 estex_guest_room_05_domicile_building_desc: "Apartments of state that would not shame a royal palace. Visiting dignitaries leave impressed, and say so at home."
 estex_guest_room_06_domicile_building: "The King's Lodgings"
 estex_guest_room_06_domicile_building_desc: "Chambers kept ready should the crown itself come calling. Hosting a royal progress can beggar a house, and everyone knows it, which is rather the point."
