 ### Dovecote events
 estex_estate.3301.t: "The Wrong Window"
 estex_estate.3301.desc: "One of the morning birds is not yours. It sits on the loft ledge with a neat little scroll at its leg, addressed in a hand you do not know, to a name you do: someone under your own roof. The bird, of course, will tell no one either way."
 estex_estate.3301.a: "Read it."
 estex_estate.3301.a.tt: "You will learn one of [fe_gossip_target.GetFirstName]'s secrets"
 estex_estate.3301.b: "Send it on, sealed."
 estex_estate.3301.message: "A Letter Gone Astray"
 estex_estate.3302.t: "Intercepted"
 estex_estate.3302.desc: "The loft master appears at your door with a strange bird in one fist and a tiny scroll in the other. It crossed your land at dusk, flying low and fast, and his best birds brought it down. The seal is unbroken. For the moment."
 estex_estate.3302.a: "Open it."
 estex_estate.3302.a.plot.tt: "The letter names someone who is scheming against you"
 estex_estate.3302.a.gossip.tt: "Merely gossip, but word spreads that nothing flies past your land unread"
 estex_estate.3302.b: "Let it fly on. I want no part of this."
 estex_estate.3302.message: "The Intercepted Letter"
 estex_estate.3303.t: "A Verse on White Wings"
 estex_estate.3303.desc: "The court poet has finished the commission: eight lines, quite good ones, about [fe_beloved.GetFirstName]. The white dove waits in its wicker cage, unbearably picturesque. All that remains is to tie the verse to its leg and open the window."
 estex_estate.3303.a: "Send the verse."
 estex_estate.3303.a.good.tt: "The dove, the verse, the morning light: it all lands perfectly"
 estex_estate.3303.a.bad.tt: "The poet, it turns out, was drunk, and the third line does not rhyme so much as insult"
 estex_estate.3303.b: "Poetry is not power."
 estex_estate.3303.message.good: "The Verse Lands Perfectly"
 estex_estate.3303.message.bad: "The Poet Was Drunk"
 estex_estate.3304.t: "A Hawk Among the Doves"
 estex_estate.3304.desc: "Four birds this month, taken in the air above your own walls, and the culprit is no wild bird: it wears jesses. The falconers say it belongs to [fe_hawk_owner.GetFirstName], whose hunting parties have been ranging closer than courtesy allows."
 estex_estate.3304.a: "Demand compensation."
 estex_estate.3304.b: "Shoot the hawk."
 estex_estate.3304.c: "A magnificent bird. Offer to buy it."
 estex_estate.3305.t: "Pigeon Pie"
 estex_estate.3305.desc: "The pie was excellent, everyone agreed, right up until the loft master burst in demanding to know why his fastest bird's leg ring was sitting at the edge of your plate. The kitchen maintains it was an honest mistake. The bird maintains nothing, being a pie."
 estex_estate.3305.a: "That bird was worth more than the cook."
 estex_estate.3305.b: "It was, admittedly, delicious."
 estex_estate.3306.t: "The Homing Instinct"
 estex_estate.3306.desc: "The loft master brings it to you cupped in both hands: an old bird, wing-worn and half blind, that landed on the ledge this morning as if it had never been away. The message at its leg is faded and rain-spotted, tied there years ago by a hand long since still."
 estex_estate.3306.a: "Read the old words."
 estex_estate.3306.b: "Bury it unread, with honor."
 estex_estate.3307.t: "Guano Gold"
 estex_estate.3307.desc: "The gardeners are cagey about their methods this year, but the kitchen garden has gone berserk, the roses are the size of cabbages, and the dovecote's undercroft has been swept suspiciously clean. Whatever is in there, the neighbors want some."
 estex_estate.3307.a: "Sell the surplus."
 estex_estate.3307.b: "Gift it to the village priest's garden."
