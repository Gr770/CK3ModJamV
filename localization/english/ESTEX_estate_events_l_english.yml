 estex_debug_fire_estate_event_decision_desc:0 "Fires a random event from the estate event pool. Testing only, remove before release."
 estex_debug_fire_estate_event_decision_tooltip:0 "Fire a random ELIGIBLE estate event (debug). Events keep their conditions: castellan events need a castellan (the away ones also need you travelling or on campaign), Old Keys needs them aged 60+, deer park events need the buildings, venison needs a vassal. Cooldowns still apply so the pool can run dry."
 estex_debug_fire_estate_event_decision_confirm:0 "Roll the dice"
