l_english:
 ### Castellan events
 estex_estate.1001.t: "A Dispute Below Stairs"
 estex_estate.1001.desc: "A letter reaches you on the road. In your absence, a feud between the cellarer and the head groom boiled over into shoving matches and spoiled stores. Your castellan [fe_castellan.GetFirstName] locked the pair of them in a room together until they sorted it out, and the household is running smoothly again."
 estex_estate.1001.a: "[fe_castellan.GetFirstName] has my trust."
 estex_estate.1001.b: "I will review the matter myself when I return."
 estex_estate.1002.t: "A Thief in the Night"
 estex_estate.1002.desc: "Word arrives from home: [fe_castellan.GetFirstName] caught a thief halfway out the pantry window with a sack of silver plate. The thief now sits in the gatehouse awaiting your pleasure, and the plate is back on its shelf."
 estex_estate.1002.a: "Reward such vigilance."
 estex_estate.1002.b: "Hang the thief."
 estex_estate.1002.c: "Let the fool go, minus the sack."
 estex_estate.1003.t: "The Ledgers Do Not Add Up"
 estex_estate.1003.desc: "Reviewing the estate accounts from the road, you find the sums keep coming up short. Grain sold that was never recorded, repairs billed twice. The trail leads, unmistakably, to your castellan [fe_castellan.GetFirstName]."
 estex_estate.1003.a: "Confront [fe_castellan.GetFirstName] and recover every coin."
 estex_estate.1003.b: "A loyal servant is worth a little skimming."
 estex_estate.1010.t: "The Castellan's Ambition"
 estex_estate.1010.desc: "[fe_castellan.GetFirstName] requests an audience, and after long praise of your household comes to the point: years of faithful service, the keys carried through winter and war, and nothing to show for it but wages. A boon would not go amiss."
 estex_estate.1010.a: "Well earned. Grant a generous purse."
 estex_estate.1010.b: "Faithful service is its own reward."
 estex_estate.1011.t: "Old Keys"
 estex_estate.1011.desc: "Feeling the years, [fe_castellan.GetFirstName] has begun setting affairs in order, and presents you with a small iron key you have never seen. It fits, apparently, a door in the undercroft that the previous castellan never spoke of."
 estex_estate.1011.a: "Open the old door."
 estex_estate.1011.b: "Some doors are better left shut."
 ### Deer park events
 estex_estate.2001.t: "Poachers!"
 estex_estate.2001.desc: "Your keepers surprised three men dressing a doe at the edge of your hunting grounds. They did not even run, just stood there with the blood on their hands and their eyes on their boots. Times are lean in the village, but the law is the law."
 estex_estate.2001.a: "Fine them and send them home."
 estex_estate.2001.b: "Make an example of them."
 estex_estate.2001.c: "Throw them in the cells."
 estex_estate.2002.t: "The White Hart"
 estex_estate.2002.desc: "The keepers swear to it: a hart, white as snow, grazing at dawn among the oaks of your park. The whole estate is whispering. Some say it is a blessing, some say it is a challenge, and some say it is just a deer."
 estex_estate.2002.a: "Ride it down."
 estex_estate.2002.a.tt: "The chase begins"
 estex_estate.2007.t: "The Relentless Chase"
 estex_estate.2007.desc: "There! A flash of white between the oaks, and the hounds give tongue. The hart runs like nothing you have ever ridden after, doubling back through streams and thorn brakes, always a length ahead of the dogs. Your horse is lathered, your legs are burning, and the beast is still out there."
 estex_estate.2007.a: "Spur on!"
 estex_estate.2007.a.tt: "You ride hard after the white hart"
 estex_estate.2007.success.tt: "You run the hart to ground at last"
 estex_estate.2007.fail.tt: "The hart stays ahead of the hounds, and the chase goes on"
 estex_estate.2007.b: "Enough. Call off the hounds."
 estex_estate.2002.b: "Such a creature is an omen. Let it roam."
 estex_estate.2005.t: "The Hart Falls"
 estex_estate.2005.desc: "Three hours through bracken and stream, and at the end of it the white hart stood at bay in a clearing like something out of a chanson. Your spear took it clean. The keepers are already arguing about who gets to tell the story, and the pale antlers are yours forever. Which leaves the question of the meat."
 estex_estate.2005.a: "Keep it for a celebratory feast."
 estex_estate.2005.b: "Share the meat with the village."
 estex_estate.2006.t: "Vanished Among the Oaks"
 estex_estate.2006.desc: "You had it. A clear run, ground falling away, the white shape flickering between the trees, and then nothing. No tracks, no broken twigs, as if the forest had simply closed a door. The ride home was very quiet."
 estex_estate.2006.a: "It was only a deer."
 estex_estate.2006.b: "It was a sign, and I hunted it anyway."
 estex_estate.2003.t: "The Carp Harvest"
 estex_estate.2003.desc: "The fishponds have outdone themselves this season. The netting took two days, and the cellars now hold more salted carp than the household could eat in a year of Fridays."
 estex_estate.2003.a: "Sell the surplus."
 estex_estate.2003.b: "Send a barrel to my liege."
 estex_estate.2004.t: "A Gift of Venison"
 estex_estate.2004.desc: "The season's hunting has filled the larder to bursting, and a whole buck hangs surplus in the cold house. Venison travels well, and [fe_gift_target.GetFirstName] keeps a good table."
 estex_estate.2004.a: "Send a haunch with my compliments."
 estex_estate.2004.b: "My table needs it more."
