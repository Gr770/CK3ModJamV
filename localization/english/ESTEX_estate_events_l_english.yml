 ### Tournament events
 estex_estate.3001.t: "The Broken Lance"
 estex_estate.3001.desc: "[fe_lance_knight.GetFirstName] took a lance badly at your lists and came off worse for it. He lies in your hall now, ribs strapped, pride shattered, and, his squire quietly admits, in debt to half the moneylenders between here and home. His rival [fe_lance_rival.GetFirstName], meanwhile, lingers by the gate, undefeated and unemployed."
 estex_estate.3001.a: "Pay [fe_lance_knight.GetFirstName]'s debts. He rides for me now."
 estex_estate.3001.b: "[fe_lance_rival.GetFirstName] fought better. Hire him instead."
 estex_estate.3001.c: "It is a rough sport."
 estex_estate.3002.t: "Local Lads at the Butts"
 estex_estate.3002.desc: "A farmer's son called [fe_archer.GetFirstName], waiting his turn at your archery butts, put three shafts into the center ring while your men at arms managed one between them. The whole field saw it. The lad looks like he wants to sink into the earth."
 estex_estate.3002.a: "Reward such an arm."
 estex_estate.3002.b: "Take [fe_archer.GetFirstName] into my service."
 estex_estate.3002.c: "Embarrassing my soldiers is unwise."
 estex_estate.3003.t: "A Challenger Arrives"
 estex_estate.3003.desc: "A knight none of your household knows rode through the gates at midday, walked his horse to your lists, and declared that he would try the famous grounds of this estate against its lord or anyone the lord dares send."
 estex_estate.3003.a: "I will answer him myself."
 estex_estate.3003.a.tt: "The bout will be run on the morrow, and prowess counts"
 estex_estate.3003.b: "My champion will see to it."
 estex_estate.3003.c: "Turn him away."
 estex_estate.3007.t: "The Challenger Unhorsed"
 estex_estate.3007.desc: "The pass lasted three strides of the horses and ended with [fe_challenger.GetFirstName] flat on his back in front of your assembled household, staring at the sky through his visor. Your grounds have never heard cheering like it. To his credit, he takes off his helm and laughs."
 estex_estate.3007.a: "You fight well. Serve me."
 estex_estate.3007.b: "A good bout. Send him on his way."
 estex_estate.3008.t: "In the Dirt"
 estex_estate.3008.desc: "You remember the first stride, the lowered lance, and then the sky. [fe_challenger.GetFirstName] sits his horse at the end of the lists, courteously not celebrating, which is somehow worse. Your household studies its shoes."
 estex_estate.3008.a: "Well struck, sir."
 estex_estate.3008.b: "Get out of my sight."
 estex_estate.3004.t: "The Grudge Match"
 estex_estate.3004.desc: "[fe_knight_a.GetFirstName] and [fe_knight_b.GetFirstName] have hated each other for years, quietly and then not so quietly. Now they stand before you together, asking leave to settle it properly: at your grounds, with rebated weapons, before witnesses."
 estex_estate.3004.a: "Let them settle it before witnesses."
 estex_estate.3004.a.tt: "One of them will not walk away unhurt"
 estex_estate.3004.b: "Forbid it."
 estex_estate.3004.c: "Let them fight, and take wagers."
 estex_estate.3005.t: "Seats of Honor"
 estex_estate.3005.desc: "The trouble began over a cushion. [fe_guest_a.GetFirstName] claims the seat nearest your own in the berfrois by right of precedence, [fe_guest_b.GetFirstName] by right of having sat there first. Neither will move, and the entire stand is watching you instead of the lists."
 estex_estate.3005.a: "Smooth it over."
 estex_estate.3005.a.win.tt: "A jest and a shuffle of cushions, and honor is satisfied all around"
 estex_estate.3005.a.lose.tt: "Someone still ends up on the lesser cushion, and remembers it"
 estex_estate.3005.b: "Rank is rank. [fe_guest_a.GetFirstName] sits closest."
 estex_estate.3006.t: "The Old Champion"
 estex_estate.3006.desc: "You know the name the moment the steward announces it. Twenty years ago it was shouted at every tourney from here to the coast. The man himself is grayer than the songs say, and direct: his jousting days are done, but what he knows could make your knights the terror of the circuit, if you will keep him."
 estex_estate.3006.a: "There is a place for you here, champion."
 estex_estate.3006.b: "We have masters enough."
 ### Dungeon events
 estex_estate.3101.t: "Sounds From Below"
 estex_estate.3101.desc: "The cells are not deep enough, that is the trouble. On still nights the sounds come up through the flagstones into the hall, and the household has begun eating supper a little faster than it used to."
 estex_estate.3101.a: "Let them wail."
 estex_estate.3101.b: "Good. Let it carry."
 estex_estate.3101.c: "See to their comfort."
 estex_estate.3102.t: "The Escape Attempt"
 estex_estate.3102.desc.cells: "[fe_escapee.GetFirstName] spent three patient weeks working a bar loose from the cellar window, and last night went through it. The hue and cry went up within the hour, but the cellar cells were never built for keeping anyone determined."
 estex_estate.3102.desc.dungeon: "[fe_escapee.GetFirstName] made a run for it last night, got as far as the outer yard, and discovered why the dungeon has two gates. The guards brought them back before the household had finished waking up."
 estex_estate.3102.desc.oubliette: "In the night the guards heard scrabbling from the pit where [fe_escapee.GetFirstName] was given, soft and steady, like something trying to climb. By morning it had stopped. No one has asked to check."
 estex_estate.3102.a: "So it goes."
 estex_estate.3102.a.escaped.tt: "[fe_escapee.GetFirstName] may get away clean, and word of a breakout costs you Dread"
 estex_estate.3102.a.caught.tt: "[fe_escapee.GetFirstName] is caught at the gate, and everyone hears of it"
 estex_estate.3102.a.dungeon.tt: "No one escapes the dungeon, and everyone hears of it"
 estex_estate.3102.a.oubliette.tt: "No one has ever escaped the pit"
 estex_estate.3102.message: "A Prisoner Escapes!"
 estex_estate.3102.b: "Double the watch."
 estex_estate.3103.t: "A Name You Forgot"
 estex_estate.3103.desc: "A hedge priest at your gate asks, politely, after a man given into your keeping years ago. A cousin, he says. The name means nothing to you for a long moment, and then it means the oubliette, and the counting of years."
 estex_estate.3103.a: "I meant every day of it."
 estex_estate.3103.b: "I had honestly forgotten."
 estex_estate.3103.c: "Bring them up. Give them burial."
 estex_estate.3104.t: "The Question"
 estex_estate.3104.desc: "The gaoler reports that [fe_prisoner.GetFirstName] has been talkative lately, in the way of prisoners who suspect worse is available. The chamber below is quiet, well equipped, and very persuasive. It would be a shame not to ask."
 estex_estate.3104.a: "Put the question."
 estex_estate.3104.a.secret.tt: "You will learn one of the prisoner's secrets"
 estex_estate.3104.message: "The Chamber Yields a Secret"
 estex_estate.3104.a.nothing.tt: "Nothing but screams. Word of them spreads all the same"
 estex_estate.3104.b: "Not today."
 estex_estate.3105.t: "The Ransom Note"
 estex_estate.3105.desc: "The letter is politely desperate. The family of [fe_prisoner.GetFirstName] cannot raise the ransom in coin, not this year and probably not next. What they offer instead is their gratitude, plainly and formally pledged, to be called upon when you need it."
 estex_estate.3105.a: "A favor, then. Owed and remembered."
 estex_estate.3105.b: "Coin or nothing. They will find it."
 estex_estate.3105.c: "They stay where they are."
 estex_estate.3106.t: "Rats in the Walls"
 estex_estate.3106.desc: "The gaoler's report is short: the damp is winning. Water down the north wall, rats bold as house cats, and a smell that has started climbing the stairs. The masons can fix it, for a price. The prisoners can endure it, for free."
 estex_estate.3106.a: "Pay for repairs."
 estex_estate.3106.b: "Prisoners cannot be choosers."
 estex_estate.3106.b.tt: "One of your prisoners falls ill"
 ### Crossovers
 estex_estate.3201.t: "A Guest of Quality"
 estex_estate.3201.desc: "[fe_guest.GetFirstName] arrived in chains but wears the bearing of someone who has never carried anything heavier than a signet ring. The castellan awaits your word: the cells are ready, but so, he notes carefully, are the guest quarters, and wellborn captives have wellborn relatives."
 estex_estate.3201.a: "Rooms befitting their station."
 estex_estate.3201.b: "The cells will do."
 estex_estate.3202.t: "The Sore Loser"
 estex_estate.3202.desc: "The match ended an hour ago, but the day's real entertainment came after: a stable boy caught [fe_loser.GetFirstName], yesterday's defeated knight, crouched in the tack room with a knife against his rival's saddle girth. He offers no explanation. The girth offers enough."
 estex_estate.3202.a: "Fine him and be done."
 estex_estate.3202.b: "Throw [fe_loser.GetFirstName] in the cells."
 estex_estate.3202.c: "Let him slink home."
