l_english:


 # Domicile Parameters
 domicile_building_parameter_estex_enables_kitchen_decision: "Enables the [decision|E] to #V $estex_inspect_kitchen_decision$#!"
 domicile_building_parameter_estex_enables_kitchen_decision_minor_bonus: "Slightly increased chances of #P positive#! results from the [decision|E] to #V $estex_inspect_kitchen_decision$#!"
 domicile_building_parameter_estex_enables_kitchen_decision_major_bonus: "Moderately increased chances of #P positive#! results from the [decision|E] to #V $estex_inspect_kitchen_decision$#!"
 domicile_building_parameter_estex_enables_hunting_decision: "Enables the [decision|E] to #V $estex_train_hunting_decision$#!"
 domicile_building_parameter_estex_enables_bathing_decision: "Enables the [decision|E] to #V $estex_enjoy_luxurious_bath_decision$#!"
 domicile_building_parameter_estex_enables_bathing_decision_bonus: "Each level of this building increasingly increases the amount of [stress_loss_i|E] [stress|E] lost when taking the [decision|E] to #V $estex_enjoy_luxurious_bath_decision$#!"
 domicile_building_parameter_estex_enables_dungeon_decision: "Enables the [decision|E] to #V $estex_purchase_dungeon_equipment$#!"
 domicile_building_parameter_estex_enables_library_decision: "Enables the [decision|E] to #V $estex_read_in_library$#!"
 domicile_building_parameter_estex_enables_library_decision_bonus: "Increases the [lifestyle_experience|E] gained from the [decision|E] to #V $estex_read_in_library$#!"

 ### Modifiers
 estex_inspected_kitchen_modifier: "Inspected Estate Kitchen"
 estex_inspected_kitchen_modifier_desc: "This character recently inspected their estate's kitchen and found nothing wrong with how it was run."
 estex_inspected_kitchen_inspired_modifier: "Inspired Kitchen Staff"
 estex_inspected_kitchen_inspired_modifier_desc: "This character's recent inspection of their estate's kitchen inspired the kitchen staff to work even harder."
 estex_inspected_kitchen_fixed_problems_modifier: "Fixed Problems in the Estate Kitchen"
 estex_inspected_kitchen_fixed_problems_modifier_desc: "This character recently inspected their estate's kitchen and found some issues with how it was run. They have done their best to rectify these issues."
 estex_inspected_kitchen_problems_modifier: "Ongoing Problems in the Estate Kitchen"
 estex_inspected_kitchen_problems_modifier_desc: "This character recently inspected their estate's kitchen and found some issues with how it was run. They were unable to resolve those issues."
 estex_purchased_dungeon_equipment_modifier: "Purchased New Dungeon Equipment"

 ### Decisions
 estex_inspect_kitchen_decision: "Inspect the Kitchens"
 estex_inspect_kitchen_decision_tooltip: "Receive random [modifiers|E] for inspecting your kitchens"
 estex_inspect_kitchen_decision_desc: "My estate has an extensive kitchen and staff. However, I need to inspect them regularly to ensure that they are up to my standards, both for feeding myself and when I host banquets or other social occasions."
 estex_inspect_kitchen_decision_effect_tooltip_1: "Can potentially gain [prestige_i|E] [prestige|E] as well as #P positive#! (and occasionally #N negative#!) [modifiers|E]"
 estex_inspect_kitchen_decision_confirm: "Send word to the kitchen staff!"
 estex_train_hunting_decision: "Practice Hunting"
 estex_train_hunting_decision_tooltip: "I should practice my hunting skills if I have the space for it."
 estex_train_hunting_decision_desc: "My estate has extensive wide spaces where I can practice my hunting skills. That way, I can impress everyone when it's time to do a #italic real#! hunt."
 estex_train_hunting_decision_confirm: "Let's prepare for some practice hunting!"
 estex_enjoy_luxurious_bath_decision: "Enjoy Luxurious Bath"
 estex_enjoy_luxurious_bath_decision_tooltip: "I need to clean myself... but in a luxurious way!"
 estex_enjoy_luxurious_bath_decision_desc: "Every baths once in a while. But to bath in style? With the best soaps and fragrances? With water altered to the ideal temperature? I have a bathhouse that can facilitate such an experience. It would be a waste not to make use of it."
 estex_enjoy_luxurious_bath_decision_confirm: "Oh, I can't wait!"
 estex_purchase_dungeon_equipment: "Purchase New Dungeon Equipment"
 estex_purchase_dungeon_equipment_tooltip: "The dungeon isn't going to function simply because it exists."
 estex_purchase_dungeon_equipment_desc: "Dungeons are for imprisoning, torturing, and doing all sorts of questionable activities. Yet, one needs the right equipment to do these things effectively."
 estex_purchase_dungeon_equipment_confirm: "Procure the dungeon equipment!"
 estex_read_in_library: "Read in Estate Library"
 estex_read_in_library_tooltip: "Books! Books! Books! Who doesn't love books?"
 estex_read_in_library_desc: "Libraries are full of books. Knowledge and literary amusements at my fingertips! What use is a library if I don't make use of it?"
 estex_read_in_library_confirm: "Time to do some reading!"
 estex_read_in_library_effect_tooltip: "You will gain [lifestyle_experience|E] in your current [lifestyle|E]"

 ### Events
 estex_building_flavor.0100.t: "Kitchen Inspection"
 estex_building_flavor.0100.desc: "My estate's kitchens should always meet the high standards expected for a [ROOT.Char.GetTitleAsNameNoTooltip] like myself.\n\nToday, I have decided to surprise the kitchen staff with a routine inspection. Will they uphold the high standards I have set for them?"
 estex_building_flavor.0100.a: "Let's see, then!"
 estex_building_flavor.0100.toast.1: "You find nothing out of ordinary during the inspection"
 estex_building_flavor.0100.toast.2: "Your kitchen staff are inspired to work harder thanks to the inspection"
 estex_building_flavor.0100.toast.3: "You find some problems with the kitchen during the inspection"
 estex_building_flavor.0101.t: "$estex_building_flavor.0100.t$: Adequate Results"
 estex_building_flavor.0101.desc: "Though my kitchen staff were surprised to see me, I found that nothing was out of the ordinary during the inspection. They have a good supply and variety of food, the cooking equipment is clean and in good order, and the staff are alert and appear competent.\n\nI have nothing to fear when it comes to serving meals for myself or for any esteemed guests."
 estex_building_flavor.0101.a: "Very good."
 estex_building_flavor.0102.t: "$estex_building_flavor.0100.t$: Inspired Staff"
 estex_building_flavor.0102.desc: "I found nothing wrong during my kitchen inspection, whether it was the kinds of foodstuffs they had on hand, to the quality and cleanliness of the cooking equipment.\n\nHowever, remarkably, it seems like my presence has ignited something in the kitchen staff, as they appear to work even harder than normal to meet my high standards.\n\nI have no doubt that in the near future, any meals they make for myself or for my esteemed guests will be excellent and scrumptious!"
 estex_building_flavor.0102.a: "Very good."
 estex_building_flavor.0103.t: "$estex_building_flavor.0100.t$: Disappointing Results"
 estex_building_flavor.0103.desc: "My kitchen staff were surprised by my visit, and I was glad I came unannounced, as I was very disappointed with what I found.\n\nSupplies of food were lacking. Kitchen equipment was in poor condition or dirty, or both. Staff were inattentive and some did not seem very competent.\n\nWhile I could simply reprimand them for these errors, perhaps I should dedicate some funding to improve this kitchen or even hire newer and better kitchen staff."
 estex_building_flavor.0103.a: "Dedicate extra funding to the kitchens"
 estex_building_flavor.0103.b: "Just scold the staff"
 estex_building_flavor.0110.t: "Hunting Practice"
 estex_building_flavor.0110.desc: "The deer park by my estate is full of nature, or at least a good approximation of it.\n\nToday, with a small group, we practice various hunting maneuvers and techniques. I'm learning a lot about proper hunting tactics, while having some fun along the way!"
 estex_building_flavor.0110.a: "It almost feels like the real thing!"
 estex_building_flavor.0110.small.hunter: "You gain a little experience hunting"
 estex_building_flavor.0110.medium.hunter: "You gain some experience hunting"
 estex_building_flavor.0110.large.hunter: "You gain a lot of experience hunting"
 estex_building_flavor.0110.small.falconer: "You gain a little experience in falconry"
 estex_building_flavor.0110.medium.falconer: "You gain some experience in falconry"
 estex_building_flavor.0110.large.falconer: "You gain a lot of experience in falconry"
 estex_building_flavor.0120.t: "Luxurious Bathing"
 estex_building_flavor.0120.desc: "Some fools think soaking oneself in warm water with some cheap soap and flowers is “luxury bathing.” Ha!\n\nNow the baths at my estate?\n\nThat's #italic real#! bathing."
 estex_building_flavor.0120.a: "By [ROOT.Char.GetFaith.HighGodName], I could stay in this bath all day and night...."
 estex_building_flavor.0130.t: "New Dungeon Equipment"
 estex_building_flavor.0130.desc: "What's a dungeon without the equipment?\n\nFrom unusually shaped cages, to ingenious devices designed to encourage a few screams, to basic supplies for the dungeon staff to live through their miserably sadistic jobs, and more, a dungeon is nothing without its equipment.\n\nI have thus put in an order for some new equipment."
 estex_building_flavor.0130.a: "I'm sure this equipment will serve me very, very well."
 estex_building_flavor.0140.t: "Read in the Library"
 estex_building_flavor.0140.desc: "My estate's library isn't just for show. It has books. Lots of them!\n\nEscaping from the hustle and bustle of daily life, I can enjoy some books and maybe learn a thing or two. Who knows? Maybe the new knowledge will help me in my daily work, or perhaps I might find an inspiring tale to entertain myself."
 estex_building_flavor.0140.a: "What to read? What to read?"
