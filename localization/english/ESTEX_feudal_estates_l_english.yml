l_english:
 # Deliberately displayed as plain Feudal so players never see it's a separate
 # government type, all references point at the vanilla feudal strings so any
 # patch wording changes carry over automatically
 feudal_estate_government: "$feudal_government$"
 feudal_estate_government_adjective: "$feudal_government_adjective$"
 feudal_estate_government_realm: "$feudal_government_realm$"
