 feudal_estate_government_with_icon: "@government_type_feudal! $feudal_estate_government$"
 establish_feudal_estate_decision: "Establish a Family Seat"
 establish_feudal_estate_decision_desc: "A lord holds many lands, but a house needs one place that is truly its own: walls that carry the family name, halls where its dead are remembered and its children raised.\n\nLet it be proclaimed that [ROOT.Char.GetCapitalLocation.GetName] and the lands around it are set aside forever as the seat of [ROOT.Char.GetHouse.GetName]."
 establish_feudal_estate_decision_tooltip: "Set aside demesne lands at your capital as your house's permanent [domicile|E]"
 establish_feudal_estate_decision_confirm: "Let the household be gathered."
 establish_feudal_estate_effect_tt: "Your capital becomes the seat of your house: you gain an #high Estate#! with its own buildings, watched over by a $estex_castellan_court_position$ once its keep is raised in stone"

