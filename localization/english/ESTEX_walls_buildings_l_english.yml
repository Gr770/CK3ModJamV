l_english:
 estex_walls_01_domicile_building: "Curtain Walls"
 estex_walls_01_domicile_building_desc: "A ring of dressed stone around the estate, high enough to turn a raid and thick enough to turn a mind. Travelers on the road see the walls long before they see the keep, and adjust their manners accordingly."
 estex_gatehouse_02_domicile_building: "Gatehouse"
 estex_gatehouse_02_domicile_building_desc: "Twin towers, a murder hole and a portcullis that drops with a sound like judgment. Every visitor now enters your house through a stone throat, and every visitor knows it."
