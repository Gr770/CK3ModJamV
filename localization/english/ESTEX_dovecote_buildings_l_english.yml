l_english:
 estex_dovecote_01_domicile_building: "Dovecote"
 estex_dovecote_01_domicile_building_desc: "A stone tower of nesting doves, squabs for the table and rich droppings for the fields. Keeping one is a lord's privilege, and the neighbors know it."
 estex_rookery_02_domicile_building: "Rookery"
 estex_rookery_02_domicile_building_desc: "Trained birds now come and go with slips of paper at their legs. Letters that once took a rider a week arrive with the dawn, and nobody thinks to question a bird."
 estex_masters_loft_03_domicile_building: "Master's Loft"
 estex_masters_loft_03_domicile_building_desc: "The loft master keeps certain birds apart from the rest, flown at night to certain windows. Your words arrive before your rivals' riders have saddled, and your plots move accordingly."
 estex_white_doves_03_domicile_building: "White Doves"
 estex_white_doves_03_domicile_building_desc: "Snow white birds bearing verses, favors and elegant persuasion. A letter delivered by a white dove is opened smiling, and half won before it is read."
